name: Spelersdata bijwerken

on:
  schedule:
    # elke 3 uur: Supabase wakker houden en kijken of er een nieuwe speelronde is afgerond
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ook bijwerken als de speelronde niet is veranderd"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Data ophalen en naar Supabase sturen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force }}
        run: python3 scripts/update_data.py
      - name: Site opnieuw bouwen (nieuwe data in index.html)
        run: python3 build.py
      - name: Committen als er iets is veranderd
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            git config user.name "data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "Spelersdata bijgewerkt"
            git push
          else
            echo "Geen wijzigingen"
          fi
